services:
  - type: web
    name: matar-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python Matar-bot-FINAL-merged.py
    envVars:
      - key: TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BASE_BRANCH
        value: main
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_PERSISTENT_DATABASE
        value: "1"
      - key: DATABASE_PATH
        value: /tmp/matar_ultimate.db
      - key: BACKUP_DIR
        value: /tmp/matar-backups
      - key: LOG_DIR
        value: /tmp/matar-logs
