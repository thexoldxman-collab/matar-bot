name: Build Matar Admin APK

concurrency:
  group: android-admin-apk-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "android-admin/**"
      - ".github/workflows/android-admin-apk.yml"
      - "matar_admin_api.py"
      - "matar_admin_auth.py"
      - "Matar-bot-FINAL-merged.py"
      - "tests/**"
  push:
    branches: [main, feature/matar-admin-release]
    paths:
      - "android-admin/**"
      - ".github/workflows/android-admin-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-admin
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: matar-admin-debug-apk
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
