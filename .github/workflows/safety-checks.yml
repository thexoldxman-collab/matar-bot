name: Matar Bot safety checks

on:
  push:
    branches:
      - "audit/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN: "123456:TESTTOKEN"
      ADMIN_ID: "999999"
      DATABASE_PATH: "/tmp/matar-test.db"
      BACKUP_DIR: "/tmp/matar-backups"
      LOG_DIR: "/tmp/matar-logs"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime dependencies and static checker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyflakes
      - name: Compile main bot
        run: python -m py_compile Matar-bot-FINAL-merged.py tests/test_regressions.py
      - name: Run regression tests with isolated SQLite database
        run: python -m unittest discover -s tests -v
      - name: Run pyflakes
        run: python -m pyflakes Matar-bot-FINAL-merged.py tests
