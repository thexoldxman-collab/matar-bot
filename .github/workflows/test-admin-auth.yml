name: Matar Admin authentication tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/matar-admin-app-login"]

jobs:
  admin-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install "Flask==3.0.0"
      - name: Test secure app pairing
        run: python -m unittest -v test_admin_auth_compat.py
